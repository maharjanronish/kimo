<?xml version="1.0" encoding="UTF-8"?>
<!-- LAZINESS — SMIL stress benchmark: infinite handheld/shadow/motes/turbulence
     loops, finite freeze camera push / title fade / glitch / slash / split.
     Animated filter parameters, displacement map, animated clipPath, <use>,
     userSpaceOnUse + objectBoundingBox gradients, stroke draw-on, textLength. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bgGrad" gradientUnits="userSpaceOnUse" x1="540" y1="0" x2="540" y2="1920">
      <stop offset="0" stop-color="#0b0e1a"/>
      <stop offset="0.55" stop-color="#111627"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="haloGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c96b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5c96b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slashGrad" gradientUnits="userSpaceOnUse" x1="150" y1="1030" x2="930" y2="1030">
      <stop offset="0" stop-color="#e04848"/>
      <stop offset="0.5" stop-color="#f5c96b"/>
      <stop offset="1" stop-color="#e04848"/>
    </linearGradient>

    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" dur="9s" repeatCount="indefinite"
                 values="0.012 0.02;0.016 0.03;0.012 0.02"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="0.6"/>
    </filter>

    <filter id="titleGlow" filterUnits="userSpaceOnUse" x="130" y="820" width="820" height="360"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feFlood flood-color="#f5c96b" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="splitLeft">
      <rect x="0" y="0" width="540" height="1920"/>
    </clipPath>
    <clipPath id="splitRight">
      <rect x="540" y="0" width="540" height="1920"/>
    </clipPath>
    <clipPath id="glitchClip">
      <rect x="130" y="-400" width="820" height="200">
        <animate attributeName="y" calcMode="discrete" begin="5.2s" dur="1.8s" fill="freeze"
                 values="900;930;905;955;912;940;900;920;-400"/>
      </rect>
    </clipPath>

    <g id="mote">
      <circle r="5" fill="#f5e6c0" opacity="0.7"/>
    </g>
  </defs>

  <!-- base -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>

  <!-- camera: slow push (finite, freezes at 16s) with handheld drift (infinite 9s) -->
  <g>
    <animateTransform attributeName="transform" type="scale" additive="sum"
                      from="1 1" to="1.08 1.08" dur="16s" begin="0s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum"
                        calcMode="spline"
                        values="0 0; 8 -10; -6 6; 5 12; 0 0"
                        keyTimes="0; 0.28; 0.55; 0.8; 1"
                        keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
                        dur="9s" repeatCount="indefinite"/>
      <use href="#mote" x="180" y="400" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" additive="sum"
                          values="0 0; 15 -240" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="21s" repeatCount="indefinite"/>
      </use>
      <use href="#mote" x="840" y="1500" opacity="0.4">
        <animateTransform attributeName="transform" type="translate" additive="sum"
                          values="0 0; -20 -300" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="17s" repeatCount="indefinite"/>
      </use>
      <use href="#mote" x="300" y="1180" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" additive="sum"
                          values="0 0; 24 -380" dur="22s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0.95;0.55" dur="22s" begin="3s" repeatCount="indefinite"/>
      </use>
      <use href="#mote" x="720" y="700" opacity="0.45">
        <animateTransform attributeName="transform" type="translate" additive="sum"
                          values="0 0; -18 -280" dur="16s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.85;0.45" dur="16s" begin="6s" repeatCount="indefinite"/>
      </use>
      <use href="#mote" x="520" y="1650" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" additive="sum"
                          values="0 0; 12 -330" dur="19s" begin="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="19s" begin="8s" repeatCount="indefinite"/>
      </use>
      <use href="#mote" x="120" y="950" opacity="0.35">
        <animateTransform attributeName="transform" type="translate" additive="sum"
                          values="0 0; 20 -260" dur="18s" begin="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.75;0.35" dur="18s" begin="5s" repeatCount="indefinite"/>
      </use>

      <!-- halo behind title -->
      <ellipse cx="540" cy="1000" rx="330" ry="180" fill="url(#haloGrad)">
        <animateTransform attributeName="transform" type="scale" additive="sum"
                          values="1;1.06;1" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <!-- shadow under title, breathing (infinite 6s) -->
      <ellipse cx="540" cy="1180" rx="240" ry="26" fill="#000000" opacity="0.55">
        <animate attributeName="rx" values="240;258;240" dur="6s" repeatCount="indefinite"/>
      </ellipse>

      <!-- grain layer over everything below the title -->
      <g filter="url(#grain)" opacity="0.5">
        <rect x="40" y="40" width="1000" height="1840" fill="#20242e" opacity="0.28"/>
      </g>

      <!-- TITLE -->
      <g filter="url(#titleGlow)">
        <g clip-path="url(#splitLeft)">
          <text x="540" y="1030" font-family="Georgia, 'Times New Roman', serif" font-size="150"
                font-weight="bold" fill="#f7f2e2" text-anchor="middle"
                textLength="760" lengthAdjust="spacingAndGlyphs"
                dx="-380">LAZINESS</text>
          <animateTransform attributeName="transform" type="translate" additive="sum"
                            from="0 0" to="-190 0" begin="8.05s" dur="7s" fill="freeze"/>
        </g>
        <g clip-path="url(#splitRight)">
          <text x="540" y="1030" font-family="Georgia, 'Times New Roman', serif" font-size="150"
                font-weight="bold" fill="#f7f2e2" text-anchor="middle"
                textLength="760" lengthAdjust="spacingAndGlyphs"
                dx="-380">LAZINESS</text>
          <animateTransform attributeName="transform" type="translate" additive="sum"
                            from="0 0" to="190 0" begin="8.05s" dur="7s" fill="freeze"/>
        </g>
        <!-- whole-title fade-in (finite 3s + 1.4s) -->
        <animate attributeName="opacity" from="0" to="1" begin="3s" dur="1.4s" fill="freeze"/>
      </g>

      <!-- glitch RGB split, revealed through the animated clipPath (finite 5.2s + 1.8s) -->
      <g clip-path="url(#glitchClip)" opacity="0.85">
        <text x="540" y="1030" font-family="Georgia, serif" font-size="150" font-weight="bold"
              fill="#ff2b2b" text-anchor="middle" textLength="760" dx="-383">LAZINESS</text>
        <text x="540" y="1030" font-family="Georgia, serif" font-size="150" font-weight="bold"
              fill="#2bffdf" text-anchor="middle" textLength="760" dx="-377">LAZINESS</text>
      </g>

      <!-- slash draw-on (finite 8s + 0.16s) -->
      <line x1="150" y1="1030" x2="930" y2="1030" stroke="url(#slashGrad)" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="780" stroke-dashoffset="780">
        <animate attributeName="stroke-dashoffset" from="780" to="0"
                 begin="8s" dur="0.16s" fill="freeze" calcMode="spline"
                 keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </line>

      <text x="540" y="1330" font-family="sans-serif" font-size="34" letter-spacing="18"
            fill="#8b93ad" text-anchor="middle" opacity="0">
        THE ART OF DOING NOTHING
        <animate attributeName="opacity" from="0" to="0.9" begin="4.2s" dur="1.2s" fill="freeze"/>
      </text>
    </g>
  </g>

  <rect width="1080" height="1920" fill="url(#vignette)"/>
</svg>
